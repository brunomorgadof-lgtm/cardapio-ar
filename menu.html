<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardápio</title>
<meta name="theme-color" content="#faf7f2">
<link rel="stylesheet" href="style.css?v=1794445152">
<script type="module" src="vendor/model-viewer.min.js"></script>
<script src="data.js?v=1794445152"></script>
</head>
<body>
<main class="wrap" id="app"></main>
<div id="cam" hidden>
  <video id="camvideo" playsinline muted autoplay></video>
  <model-viewer id="cammv" camera-controls touch-action="none" interaction-prompt="none"
    camera-orbit="0deg 68deg auto" max-camera-orbit="auto auto 10m" field-of-view="45deg" shadow-intensity="1.2" shadow-softness="0.6"
    environment-image="neutral" exposure="1.05" disable-pan></model-viewer>
  <div class="camtop">
    <span id="camname"></span>
    <button type="button" id="camclose" aria-label="Fechar">✕</button>
  </div>
  <p class="camhint" id="camhint">Aponte para a mesa. Arraste para girar e use dois dedos para aproximar.</p>
</div>
<dialog id="desk">
  <h3 style="margin:0 0 8px">Abra no celular</h3>
  <p style="margin:0 0 14px;color:var(--muted)">A realidade aumentada funciona no celular. Aponte a câmera para o QR code.</p>
  <img id="deskqr" alt="QR code desta página">
  <p><button class="btn btn-ghost" onclick="this.closest('dialog').close()">Fechar</button></p>
</dialog>
<script>
const brl = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const key = new URLSearchParams(location.search).get('r') || 'hamburgueria';
const R = RESTAURANTES[key] || RESTAURANTES.hamburgueria;
document.title = `${R.nome} · Cardápio`;
document.documentElement.style.setProperty('--accent', R.cor);
document.getElementById('deskqr').src = `qr/${key in RESTAURANTES ? key : 'hamburgueria'}.svg`;

const arIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m3 7 9 5 9-5M12 12v10"/></svg>';
const waIcon = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1 1 2 1.3 2.3 1.4.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.1.1.7-.1 1.3z"/></svg>';

const app = document.getElementById('app');
app.innerHTML = `
  <header class="hero">
    <span class="tag">${R.emoji} ${R.culinaria}</span>
    <h1>${R.nome}</h1>
    <p>${R.slogan}</p>
    <div class="hint">${arIcon.replace('<svg', '<svg width="22" height="22" style="flex:none;color:var(--accent)"')}
      <span>Arraste para girar o prato. Toque em <b>Ver na mesa</b> para ver o prato pela câmera, na sua frente.</span></div>
  </header>
  ${R.pratos.map((p, i) => `
  <article class="dish" data-i="${i}">
    <div class="stage">
      <model-viewer src="models/${p.id}.glb" alt="${p.nome} em 3D"
        ar ar-modes="scene-viewer webxr quick-look" ar-scale="fixed" ar-placement="floor"
        camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="0" rotation-per-second="20deg"
        camera-orbit="30deg 62deg auto" shadow-intensity="1" shadow-softness="0.8"
        environment-image="neutral" exposure="1.05" interaction-prompt="none" ${i > 0 ? 'loading="lazy"' : 'loading="eager"'}>
        <button slot="ar-button" hidden></button>
      </model-viewer>
      ${p.destaque ? '<span class="badge">Mais pedido</span>' : ''}
      <span class="rot">↻ arraste para girar</span>
    </div>
    <div class="body">
      <div class="row"><h2>${p.nome}</h2><span class="price">${brl(p.preco)}</span></div>
      <p class="desc">${p.desc}</p>
      ${p.credito ? `<p class="credit">Modelo 3D: <a href="${p.credito.link}" target="_blank" rel="noopener">${p.credito.titulo}</a> por ${p.credito.autor} · ${p.credito.licenca}</p>` : ''}
      ${p.tamanhos ? `<div class="sizes" role="group" aria-label="Tamanho">${p.tamanhos.map((t, j) =>
        `<button type="button" data-j="${j}" aria-pressed="${t.preco === p.preco}">${t.rotulo}</button>`).join('')}</div>` : ''}
      <div class="actions">
        <button class="btn btn-ar" type="button">${arIcon} Ver na mesa</button>
        <button class="btn btn-ghost btn-real" type="button" hidden>Tamanho real</button>
        ${WHATSAPP ? `<a class="btn btn-ghost wa" aria-label="Pedir pelo WhatsApp" target="_blank" rel="noopener">${waIcon}</a>` : ''}
      </div>
    </div>
  </article>`).join('')}
  <footer>Protótipo de cardápio em realidade aumentada</footer>`;

document.querySelectorAll('.dish').forEach(card => {
  const p = R.pratos[card.dataset.i];
  const mv = card.querySelector('model-viewer');
  const priceEl = card.querySelector('.price');
  const wa = card.querySelector('.wa');
  let label = p.nome, price = p.preco;
  const setWa = () => wa && (wa.href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(`Olá! Quero pedir: ${label} (${brl(price)})`)}`);
  setWa();

  card.querySelectorAll('.sizes button').forEach(b => b.addEventListener('click', () => {
    const t = p.tamanhos[b.dataset.j];
    card.querySelectorAll('.sizes button').forEach(x => x.setAttribute('aria-pressed', x === b));
    mv.scale = `${t.escala} ${t.escala} ${t.escala}`;
    price = t.preco; label = `${p.nome} ${t.rotulo}`;
    priceEl.textContent = brl(price); setWa();
  }));
  // Começa no tamanho marcado
  const sel = card.querySelector('.sizes [aria-pressed="true"]'); if (sel) sel.click();

  const arBtn = card.querySelector('.btn-ar');
  // Botão principal: modo câmera na própria página (funciona em qualquer navegador)
  arBtn.addEventListener('click', () => {
    pendingCard = { mv, nome: label };
    if (isMobile) openCam(); else document.getElementById('desk').showModal();
  });
  // Botão secundário: AR nativa do Google/Apple, prato preso na mesa em tamanho real
  const realBtn = card.querySelector('.btn-real');
  const showReal = () => { if (isMobile && mv.canActivateAR) realBtn.hidden = false; };
  mv.loaded ? showReal() : mv.addEventListener('load', showReal, { once: true });
  realBtn.addEventListener('click', () => { pendingCard = { mv, nome: label }; mv.activateAR(); });
  mv.addEventListener('ar-status', e => {
    if (e.detail.status === 'failed') isMobile ? openCam() : document.getElementById('desk').showModal();
  });
});

// ---------- Modo câmera (plano B que funciona em qualquer navegador) ----------
// Se a AR nativa (Google Scene Viewer / WebXR / Quick Look) não abrir, mostramos
// a câmera traseira dentro da página com o prato 3D por cima.
var pendingCard = null;
const FORCE_CAM = new URLSearchParams(location.search).has('camera');
const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
const cam = document.getElementById('cam'), video = document.getElementById('camvideo'), cammv = document.getElementById('cammv');
let stream = null;
async function openCam() {
  if (!pendingCard || !cam.hidden) return;
  const src = pendingCard.mv;
  cammv.addEventListener('load', () => {
    // Afasta a câmera para o prato ocupar uns 60% da largura, como se estivesse na mesa
    const o = cammv.getCameraOrbit();
    cammv.cameraOrbit = `0deg 68deg ${o.radius * 1.7}m`;
    cammv.jumpCameraToGoal();
  }, { once: true });
  cammv.src = src.src; cammv.scale = src.scale || '1 1 1';
  document.getElementById('camname').textContent = pendingCard.nome;
  cam.hidden = false; document.body.style.overflow = 'hidden';
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    video.srcObject = stream; await video.play().catch(() => {});
  } catch (err) {
    document.getElementById('camhint').textContent = 'Sem acesso à câmera. Você ainda pode girar o prato e aproximar com os dedos.';
    cam.classList.add('nocam');
  }
}
function closeCam() {
  cam.hidden = true; document.body.style.overflow = '';
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  cam.classList.remove('nocam');
}
document.getElementById('camclose').addEventListener('click', closeCam);
// O Scene Viewer volta para a página com este hash quando não consegue abrir.
addEventListener('hashchange', () => { if (location.hash === '#model-viewer-no-ar-fallback') setTimeout(openCam, 50); });
</script>
</body>
</html>
